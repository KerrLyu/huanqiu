<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>五子棋 · 双人联机</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F4EDE1;--ink:#2B2620;--muted:#8C8274;--card:#FFFBF4;--line:#DCD2C2;--wood:#E6C48E;--accent:#C8553D;--ok:#2E9E6A}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overscroll-behavior:none;user-select:none}
  .app{max-width:600px;margin:0 auto;padding:10px 10px 20px;display:flex;flex-direction:column;gap:9px}
  .fz{font-family:"ZCOOL KuaiLe",sans-serif;font-weight:400}
  .top{display:flex;align-items:center;gap:8px}
  .top h1{font-size:26px;margin:0;letter-spacing:4px}
  .net{font-size:11px;color:var(--muted)} .net.ok{color:var(--ok)}
  .sp{flex:1}
  .sbtn{font:inherit;font-size:12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;cursor:pointer}
  .players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pl{background:var(--card);border-radius:14px;padding:9px 12px;border:2px solid transparent;display:flex;align-items:center;gap:10px;transition:all .2s;min-width:0}
  .pl.active{border-color:var(--accent);box-shadow:0 4px 14px -8px var(--accent)}
  .stone{width:26px;height:26px;border-radius:50%;flex:none}
  .stone.b{background:radial-gradient(circle at 35% 30%,#6a6a6a,#111 60%)}
  .stone.w{background:radial-gradient(circle at 35% 30%,#fff,#d8d4cc 70%);box-shadow:inset 0 0 0 1px #bdb6aa}
  .pl .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .wins{font-size:12px;color:var(--muted)} .pl .wins b{color:var(--ink);font-size:15px}
  .tag{font-size:10px;color:#fff;background:var(--ink);border-radius:99px;padding:1px 6px;margin-left:4px;vertical-align:2px}
  .boardbox{background:var(--wood);border-radius:12px;box-shadow:0 10px 24px -14px rgba(60,40,10,.6),inset 0 0 0 1px rgba(0,0,0,.08);position:relative;touch-action:manipulation}
  svg{display:block;width:100%;height:auto}
  .emo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:70px;pointer-events:none;opacity:0;transition:opacity .2s}
  .emo.show{opacity:1;animation:pop .9s ease-out}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.3)}40%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-60%) scale(1)}}
  .msg{text-align:center;font-size:15px;min-height:22px}
  .msg .hint{color:var(--muted);font-size:13px}
  .controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
  button.b{font:inherit;font-size:14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:8px 15px;cursor:pointer}
  button.b.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.b:disabled{opacity:.4}
  .emos{display:flex;gap:6px;justify-content:center}
  .emos button{font-size:22px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;width:44px;height:40px;cursor:pointer}
  label.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  @keyframes drop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
  .new{transform-box:fill-box;transform-origin:center;animation:drop .18s ease-out}
  @keyframes glow{50%{stroke-opacity:.35}}
  .winline{animation:glow 1s infinite}
  .ov{position:fixed;inset:0;background:rgba(244,237,225,.96);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  .ov.show{display:flex}
  .box{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px -12px rgba(0,0,0,.3);max-height:94vh;overflow:auto}
  .box h2{margin:0 0 6px;font-size:30px}
  .box p{color:var(--muted);font-size:13px;line-height:1.65;margin:5px 0}
  .box input{font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);width:100%;margin:3px 0;background:#fff;color:var(--ink)}
  .field{text-align:left;font-size:12px;color:var(--muted);margin-top:8px}
  .big{width:100%;margin-top:10px;font:inherit;font-size:15px;font-weight:600;border-radius:99px;border:none;padding:11px;cursor:pointer;background:var(--ink);color:#fff}
  .big.no{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#EFE7DA;border-radius:12px;padding:4px;margin:8px 0 4px}
  .tabs button{font:inherit;font-size:14px;border:none;background:transparent;border-radius:9px;padding:8px 2px;cursor:pointer;color:var(--muted)}
  .tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .pane{display:none}.pane.on{display:block}
  .lobby{background:#F6F0E6;border-radius:12px;padding:10px;margin-top:8px;font-size:13px;line-height:1.6}
  .muted{color:var(--muted);font-size:12px}
  .code{font-size:46px;letter-spacing:8px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1 class="fz">五子棋</h1><span class="net" id="net"></span><span class="sp"></span><button class="sbtn" id="menuBtn">菜单</button></div>
  <div class="players">
    <div class="pl" id="pl0"><div class="stone" id="st0"></div><div style="min-width:0"><div class="nm" id="nm0"></div><div class="wins">赢了 <b id="w0">0</b> 局</div></div></div>
    <div class="pl" id="pl1"><div class="stone" id="st1"></div><div style="min-width:0"><div class="nm" id="nm1"></div><div class="wins">赢了 <b id="w1">0</b> 局</div></div></div>
  </div>
  <div class="boardbox"><svg id="board" viewBox="0 0 640 640"></svg><div class="emo" id="emo"></div></div>
  <div class="msg" id="msg"></div>
  <div class="controls">
    <button class="b" id="undoBtn">↶ 悔棋</button>
    <button class="b" id="resignBtn">🏳 认输</button>
    <button class="b primary" id="newBtn">再来一局</button>
  </div>
  <div class="emos" id="emos"><button>👍</button><button>😂</button><button>😤</button><button>😘</button><button>🙈</button></div>
  <div class="controls"><label class="tog"><input type="checkbox" id="confirmTog" checked> 防手滑：点两下才落子</label></div>
</div>

<div class="ov show" id="ovSetup"><div class="box">
  <h2 class="fz">五子棋</h2><p>黑棋先下，先连成五个就赢</p>
  <div class="tabs"><button data-tab="online" class="on">两部手机联机</button><button data-tab="hot">一部手机轮流</button></div>
  <div class="field">你的名字</div><input id="myName" maxlength="6" value="">
  <div class="pane on" id="pane-online"><div class="lobby" id="lobby"></div></div>
  <div class="pane" id="pane-hot">
    <div class="field">对手的名字</div><input id="hotName" maxlength="6" value="老公">
    <button class="big" id="hotStart">开始</button>
  </div>
</div></div>

<div class="ov" id="ovAsk"><div class="box"><h2 class="fz" id="askTitle"></h2><p id="askText"></p><div id="askBtns"></div></div></div>
<div class="ov" id="ovMenu"><div class="box"><h2 class="fz">菜单</h2><p id="menuInfo"></p>
  <button class="big no" id="menuClose">回到棋局</button><button class="big no" id="menuHome">回到开始页面</button></div></div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(() => {
'use strict';
const N=15, CELL=42, M=26;
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const svg=$('board');

let MODE=null, mySeat=0, G=null, pending=null, lastAnim=-1;

function newGame(names, wins, blackPlayer){
  return {gid:Math.random().toString(36).slice(2,10), names, wins:wins||[0,0], blackPlayer:blackPlayer??0,
          grid:Array(N*N).fill(0), moves:[], over:false, winner:-1, winLine:null, seq:(G?G.seq:0)+1, note:''};
}
const turnColor=()=>G.moves.length%2===0?1:2;
const playerOf=color=>color===1?G.blackPlayer:1-G.blackPlayer;
const colorOf=p=>p===G.blackPlayer?1:2;
const curPlayer=()=>playerOf(turnColor());
const myTurn=()=>MODE==='hot' || curPlayer()===mySeat;
const name=p=>G.names[p]||(p?'玩家2':'玩家1');
const pos=i=>M+i*CELL;

function checkWin(r,c,color){
  for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){
    const cells=[[r,c]];
    for(const s of [1,-1]){ let rr=r+dr*s, cc=c+dc*s;
      while(rr>=0&&rr<N&&cc>=0&&cc<N&&G.grid[rr*N+cc]===color){ cells.push([rr,cc]); rr+=dr*s; cc+=dc*s; } }
    if(cells.length>=5){ cells.sort((a,b)=>a[0]-b[0]||a[1]-b[1]); return [cells[0],cells[cells.length-1]]; }
  }
  return null;
}

// ---------- actions (each ends with commit) ----------
function commit(){ G.seq++; saveG(); render(); NET.sendState(); }
function place(r,c){
  if(G.over || G.grid[r*N+c] || !myTurn()) return;
  const color=turnColor(); G.grid[r*N+c]=color; G.moves.push([r,c]); pending=null;
  const wl=checkWin(r,c,color);
  if(wl){ G.over=true; G.winLine=wl; G.winner=playerOf(color); G.wins[G.winner]++; G.note=''; }
  else if(G.moves.length===N*N){ G.over=true; G.winner=-1; }
  commit();
}
function undoMoves(n){
  for(let k=0;k<n && G.moves.length;k++){ const [r,c]=G.moves.pop(); G.grid[r*N+c]=0; }
  if(G.over && G.winner>=0) G.wins[G.winner]=Math.max(0,G.wins[G.winner]-1);
  G.over=false; G.winner=-1; G.winLine=null; pending=null;
}
function restart(){ G={...newGame(G.names, G.wins, 1-G.blackPlayer), seq:G.seq, code:G.code}; pending=null; commit(); }
function resign(p){ if(G.over) return; G.over=true; G.winner=1-p; G.wins[1-p]++; G.note=`${name(p)} 认输了`; commit(); }

// ---------- UI ----------
function el(tag,a){ const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); return e; }
function render(){
  if(!G) return;
  svg.innerHTML=`<defs><radialGradient id="gb" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#707070"/><stop offset=".55" stop-color="#151515"/></radialGradient>
    <radialGradient id="gw" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d3c8"/></radialGradient></defs>`;
  for(let i=0;i<N;i++){
    const w=i===0||i===N-1?2.2:1.1;
    svg.appendChild(el('line',{x1:pos(0),y1:pos(i),x2:pos(N-1),y2:pos(i),stroke:'#8A6A3E','stroke-width':w}));
    svg.appendChild(el('line',{x1:pos(i),y1:pos(0),x2:pos(i),y2:pos(N-1),stroke:'#8A6A3E','stroke-width':w}));
  }
  for(const [r,c] of [[3,3],[3,11],[7,7],[11,3],[11,11]]) svg.appendChild(el('circle',{cx:pos(c),cy:pos(r),r:4.5,fill:'#6B4F2A'}));
  const last=G.moves[G.moves.length-1];
  const animate = G.moves.length!==lastAnim; lastAnim=G.moves.length;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const v=G.grid[r*N+c]; if(!v) continue;
    const isLast=last&&last[0]===r&&last[1]===c;
    const g=el('g',isLast&&animate?{class:'new'}:{});
    g.appendChild(el('circle',{cx:pos(c)+1.5,cy:pos(r)+2.5,r:18.5,fill:'rgba(0,0,0,.22)'}));
    g.appendChild(el('circle',{cx:pos(c),cy:pos(r),r:18.5,fill:v===1?'url(#gb)':'url(#gw)',stroke:v===2?'#b9b1a3':'none','stroke-width':1}));
    if(isLast) g.appendChild(el('circle',{cx:pos(c),cy:pos(r),r:5,fill:'#C8553D'}));
    svg.appendChild(g);
  }
  if(pending && !G.over){ const [r,c]=pending, v=turnColor();
    svg.appendChild(el('circle',{cx:pos(c),cy:pos(r),r:18.5,fill:v===1?'#111':'#fff','fill-opacity':.45,stroke:'#C8553D','stroke-width':2.5,'stroke-dasharray':'5 4'})); }
  if(G.winLine){ const [[r1,c1],[r2,c2]]=G.winLine;
    svg.appendChild(el('line',{x1:pos(c1),y1:pos(r1),x2:pos(c2),y2:pos(r2),stroke:'#C8553D','stroke-width':7,'stroke-linecap':'round','stroke-opacity':.85,class:'winline'})); }
  for(const p of [0,1]){
    $('st'+p).className='stone '+(colorOf(p)===1?'b':'w');
    $('nm'+p).innerHTML=esc(name(p))+(MODE==='online'&&p===mySeat?'<span class="tag">你</span>':'');
    $('w'+p).textContent=G.wins[p];
    $('pl'+p).classList.toggle('active',!G.over&&curPlayer()===p);
  }
  const cur=curPlayer(), cc=turnColor()===1?'黑':'白';
  let m;
  if(G.over) m = G.winner<0 ? '平局！棋盘下满了' : `🎉 <b>${esc(name(G.winner))}</b> 赢了！${G.note?'（'+esc(G.note)+'）':''} <span class="hint">下一局交换先后手</span>`;
  else if(pending) m=`再点一下确认落子 <span class="hint">（点别处换位置）</span>`;
  else if(MODE==='online') m = cur===mySeat ? `轮到你下（${cc}棋）` : `等 <b>${esc(name(cur))}</b> 下…（${cc}棋）`;
  else m=`轮到 <b>${esc(name(cur))}</b>（${cc}棋）`;
  if(!G.over && G.moves.length===0) m+=' <span class="hint">· 黑棋先下</span>';
  $('msg').innerHTML=m;
  $('undoBtn').disabled=!G.moves.length;
  $('resignBtn').disabled=G.over;
  $('newBtn').style.display=G.over?'':'none';
}
svg.addEventListener('click',ev=>{
  if(!G||G.over) return;
  if(!myTurn()){ flashMsg('还没轮到你哦'); return; }
  const pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const c=Math.round((p.x-M)/CELL), r=Math.round((p.y-M)/CELL);
  if(r<0||r>=N||c<0||c>=N) return;
  if(Math.hypot(p.x-pos(c),p.y-pos(r))>CELL*.62) return;
  if(G.grid[r*N+c]){ pending=null; render(); return; }
  if($('confirmTog').checked){ if(pending&&pending[0]===r&&pending[1]===c) place(r,c); else { pending=[r,c]; render(); } }
  else place(r,c);
});
let flashT=null;
function flashMsg(t){ $('msg').innerHTML=t; clearTimeout(flashT); flashT=setTimeout(render,1200); }
function showEmo(e){ const x=$('emo'); x.textContent=e; x.classList.remove('show'); void x.offsetWidth; x.classList.add('show'); clearTimeout(x._t); x._t=setTimeout(()=>x.classList.remove('show'),1400); }
$('emos').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; showEmo(b.textContent); NET.send({type:'emo',e:b.textContent}); });

let askResolve=null;
function askDialog(title,text,btns){
  $('askTitle').textContent=title; $('askText').innerHTML=text;
  $('askBtns').innerHTML=btns.map((b,i)=>`<button class="big ${i?'no':''}" data-k="${b.k}">${b.l}</button>`).join('');
  $('ovAsk').classList.add('show');
  return new Promise(r=>{ askResolve=r; });
}
$('askBtns').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||!askResolve) return; $('ovAsk').classList.remove('show'); const r=askResolve; askResolve=null; r(b.dataset.k); });

$('undoBtn').onclick=async()=>{
  if(!G.moves.length) return;
  if(MODE==='hot'){ undoMoves(1); commit(); return; }
  // online: undo my last move (and the opponent's reply if they already moved) – needs their OK
  const lastIdx=G.moves.length-1;
  const lastIsMine = playerOf(lastIdx%2===0?1:2)===mySeat;
  const n = lastIsMine ? 1 : 2;
  if(!lastIsMine && G.moves.length<2) return flashMsg('你还没下过棋呢');
  NET.send({type:'undoReq', n, from:mySeat, at:G.moves.length});
  flashMsg(`已请求悔棋，等 ${esc(name(1-mySeat))} 同意…`);
};
$('resignBtn').onclick=async()=>{
  if(G.over) return;
  const who = MODE==='online' ? mySeat : curPlayer();
  const k=await askDialog('认输？', `确定让 <b>${esc(name(who))}</b> 认输吗？`, [{k:'yes',l:'认输'},{k:'no',l:'再想想'}]);
  if(k==='yes') resign(who);
};
$('newBtn').onclick=()=>{ if(G.over) restart(); };

// ---------- network (PeerJS, no login) ----------
const NET={
  peer:null, conn:null, role:'', code:'', retryT:null, lastStatus:'',
  status(t,ok){ this.lastStatus=t; $('net').textContent=t; $('net').className='net'+(ok?' ok':''); const s=$('lbStatus'); if(s) s.textContent=t; },
  send(m){ try{ if(this.conn&&this.conn.open) this.conn.send(m); }catch(e){} },
  sendState(){ if(MODE==='online') this.send({type:'state', g:G}); },
  reset(){ try{this.conn&&this.conn.close();}catch(e){} try{this.peer&&this.peer.destroy();}catch(e){} this.peer=null; this.conn=null; clearTimeout(this.retryT); },
  host(resume){
    if(!window.Peer){ this.status('⚠ 联机组件没加载成功，请检查网络后刷新'); return; }
    this.reset(); this.role='host';
    if(!resume){ this.code=String(Math.floor(1000+Math.random()*9000)); }
    store.set('wzq_role','host'); store.set('wzq_code',this.code);
    this.lobby='hosting'; renderLobby();
    const open=(n)=>{
      this.peer=new Peer('wzq-'+this.code);
      this.peer.on('open',()=>this.status(`房间号 ${this.code}，等待对方加入…`));
      this.peer.on('connection',c=>{ if(this.conn&&this.conn.open){ try{this.conn.close();}catch(e){} } this.attach(c); });
      this.peer.on('disconnected',()=>{ try{this.peer.reconnect();}catch(e){} });
      this.peer.on('error',e=>{
        if(e.type==='unavailable-id'){ try{this.peer.destroy();}catch(x){}
          if(resume&&n<20){ this.status('正在恢复房间，请稍等…'); setTimeout(()=>open(n+1),3000); }
          else { this.code=String(Math.floor(1000+Math.random()*9000)); store.set('wzq_code',this.code); renderLobby(); open(0); } }
        else if(['network','server-error','socket-error'].includes(e.type)) this.status('⚠ 连不上联机服务器，请检查网络');
      });
    };
    open(0);
  },
  join(code){
    if(!window.Peer){ this.status('⚠ 联机组件没加载成功，请检查网络后刷新'); return; }
    this.reset(); this.role='guest'; this.code=code;
    store.set('wzq_role','guest'); store.set('wzq_code',code);
    this.lobby='joining'; renderLobby(); this.status('正在连接房间 '+code+'…');
    this.peer=new Peer();
    const connect=()=>{ if(!this.peer||this.peer.destroyed) return; this.attach(this.peer.connect('wzq-'+code,{reliable:true})); };
    this._re=connect;
    this.peer.on('open',connect);
    this.peer.on('disconnected',()=>{ try{this.peer.reconnect();}catch(e){} });
    this.peer.on('error',e=>{
      if(e.type==='peer-unavailable'){ this.status(`找不到房间 ${code}，确认号码、对方页面开着没。3 秒后重试…`); clearTimeout(this.retryT); this.retryT=setTimeout(connect,3000); }
      else if(['network','server-error','socket-error'].includes(e.type)) this.status('⚠ 连不上联机服务器，请检查网络');
    });
  },
  attach(c){
    this.conn=c;
    c.on('open',()=>{ this.status('● 已连接',true); this.send({type:'hello', name:myName(), g:loadG()}); });
    c.on('data',m=>this.onMsg(m));
    c.on('close',()=>{ if(this.conn!==c) return; this.status('⚠ 连接断开，正在重连…'); if(this.role==='guest'){ clearTimeout(this.retryT); this.retryT=setTimeout(()=>this._re&&this._re(),2500); } });
    c.on('error',()=>{});
  },
  onMsg(m){
    if(!m||typeof m!=='object') return;
    if(m.type==='hello'){
      const mine=G||loadG(), theirs=m.g;
      if(this.role==='host'){
        if(mine&&theirs&&mine.gid===theirs.gid&&theirs.seq>mine.seq) return this.adopt(theirs);
        if(mine&&mine.code===this.code){ mine.names[1]=m.name||mine.names[1]; this.adopt(mine); this.sendState(); return; }
        const g=newGame([myName(), m.name||'对手'],[0,0],0); g.code=this.code; this.adopt(g); this.sendState();
      } else if(mine&&theirs&&mine.gid===theirs.gid&&mine.seq>theirs.seq){ this.adopt(mine); this.sendState(); }
      return;
    }
    if(m.type==='state'){ if(G && m.g.gid===G.gid && m.g.seq<=G.seq) return; this.adopt(m.g); return; }
    if(m.type==='emo'){ showEmo(m.e); return; }
    if(m.type==='undoReq'){
      askDialog('悔棋请求', `<b>${esc(name(m.from))}</b> 想悔棋，同意吗？`, [{k:'yes',l:'同意'},{k:'no',l:'不同意'}]).then(k=>{
        if(k==='yes' && G.moves.length===m.at){ undoMoves(m.n); commit(); }
        else this.send({type:'undoNo'});
      });
      return;
    }
    if(m.type==='undoNo'){ flashMsg(`${esc(name(1-mySeat))} 不同意悔棋 😏`); return; }
  },
  adopt(g){
    G=g; MODE='online'; mySeat=this.role==='host'?0:1; pending=null;
    saveG(); $('ovSetup').classList.remove('show'); render();
  },
};
function saveG(){ if(G && MODE==='online') store.set('wzq_game',JSON.stringify(G)); if(G && MODE==='hot') store.set('wzq_hot',JSON.stringify(G)); }
function loadG(){ try{ return JSON.parse(store.get('wzq_game')); }catch(e){ return null; } }
const myName=()=>($('myName').value.trim()||'我');

function renderLobby(){
  const L=$('lobby'); let h='';
  if(NET.lobby==='hosting'){
    const link=location.href.split('#')[0]+'#room='+NET.code;
    h=`<div>房间号<div class="fz code">${NET.code}</div></div><div class="muted" id="lbStatus">${esc(NET.lastStatus||'正在创建房间…')}</div>
      <p>让对方用自己的手机打开这个网址，输入房间号加入；或把邀请链接发给他：</p>
      <button class="big no" id="lbCopy">复制邀请链接</button><div class="muted" style="word-break:break-all">${esc(link)}</div>
      <button class="big no" id="lbCancel">取消</button>`;
  } else if(NET.lobby==='joining'){
    h=`<div class="muted" id="lbStatus">${esc(NET.lastStatus||'正在连接…')}</div><button class="big no" id="lbCancel">取消</button>`;
  } else {
    const saved=loadG(), role=store.get('wzq_role'), code=store.get('wzq_code');
    if(saved && code){
      h+=`<div>上次的对局：<b>${esc(saved.names[0])}</b> vs <b>${esc(saved.names[1])}</b>（比分 ${saved.wins[0]}:${saved.wins[1]}）</div>
        <button class="big" id="lbResume">${role==='host'?'重开房间 '+code+' 继续':'重新连接房间 '+code+' 继续'}</button><div class="muted">两个人都点「继续」就能接着玩。也可以开新的：</div>`;
    }
    h+=`<button class="big" id="lbCreate">创建房间</button>
      <div class="field">或者输入对方的房间号</div>
      <input id="lbCode" inputmode="numeric" maxlength="4" placeholder="4 位数字" value="${NET.invite||''}">
      <button class="big" id="lbJoin">加入</button>
      <div class="muted" style="margin-top:8px">不用登录。两部手机最好连同一个 Wi-Fi，连接最稳。</div>`;
  }
  L.innerHTML=h;
  const on=(id,f)=>{ const e=$(id); if(e) e.onclick=f; };
  on('lbCreate',()=>{ store.set('wzq_name',$('myName').value.trim()); store.del('wzq_game'); NET.host(false); });
  on('lbJoin',()=>{ const c=($('lbCode').value||'').trim(); if(!/^\d{4}$/.test(c)){ $('lbCode').focus(); return; } store.set('wzq_name',$('myName').value.trim()); if(store.get('wzq_code')!==c) store.del('wzq_game'); NET.join(c); });
  on('lbResume',()=>{ NET.code=store.get('wzq_code'); if(store.get('wzq_role')==='host') NET.host(true); else NET.join(NET.code); });
  on('lbCancel',()=>{ NET.reset(); NET.lobby=''; NET.status(''); renderLobby(); });
  on('lbCopy',async()=>{ try{ await navigator.clipboard.writeText(location.href.split('#')[0]+'#room='+NET.code); $('lbCopy').textContent='已复制 ✓'; }catch(e){ $('lbCopy').textContent='请手动复制下面的链接'; } });
}

// ---------- setup ----------
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='pane-'+b.dataset.tab));
});
$('myName').value=store.get('wzq_name')||'';
{ const c=store.get('wzq_confirm'); if(c!==null) $('confirmTog').checked=c==='1'; }
$('confirmTog').onchange=e=>{ store.set('wzq_confirm',e.target.checked?'1':'0'); pending=null; render(); };
$('hotStart').onclick=()=>{
  const a=$('myName').value.trim()||'我', b=$('hotName').value.trim()||'老公';
  store.set('wzq_name',a);
  let g=null; try{ g=JSON.parse(store.get('wzq_hot')); }catch(e){}
  MODE='hot'; mySeat=0;
  G = g && g.names && g.names[0]===a && g.names[1]===b ? g : newGame([a,b],[0,0],0);
  $('ovSetup').classList.remove('show'); $('emos').style.display='none'; render();
};
$('menuBtn').onclick=()=>{ $('menuInfo').textContent = MODE==='online' ? `房间号 ${NET.code} · ${NET.lastStatus||''}` : ''; $('ovMenu').classList.add('show'); };
$('menuClose').onclick=()=>$('ovMenu').classList.remove('show');
$('menuHome').onclick=()=>location.reload();
{ const m=/room=(\d{4})/.exec(location.hash||''); if(m) NET.invite=m[1]; }
renderLobby();
window.__wzq={get G(){return G;}, NET, place};
})();
</script>
